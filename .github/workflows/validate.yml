name: Validate local monitor
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: financial-model-drift-detection-platform/scripts/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-validation
          path: financial-model-drift-detection-platform/var/ci/
