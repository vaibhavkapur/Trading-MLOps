[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-mlops-and-model-governance-platform"
version = "0.1.0"
description = "Reproducible training, dataset/feature lineage, multi-metric validation gates, model cards, RBAC paper/shadow promotion, rollback, drift monitoring, and tamper-evident audit controls for financial ML models."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary / Internal Prototype"}
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.6.0",
]
postgres = [
    "psycopg[binary]>=3.1.0",
]
mlflow = [
    "mlflow>=2.12.0",
]

[project.scripts]
trading-mlops = "trading_mlops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests", "scripts"]
