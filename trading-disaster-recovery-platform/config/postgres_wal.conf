# Reference PostgreSQL 16 WAL Archiving & PITR configuration for Trading DR Platform
# Apply only to approved local/sandbox/paper environments.

listen_addresses = '*'
max_connections = 100
shared_buffers = 256MB

# Point-in-time recovery and durable write-ahead logging
wal_level = replica
fsync = on
synchronous_commit = on
full_page_writes = on
wal_compression = on
wal_log_hints = on

# WAL Archiving to durable archive / object-store mount
archive_mode = on
archive_timeout = 30s
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'

# Checkpointing tuned for bounded recovery time
checkpoint_timeout = 5min
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 256MB

# Logging for recovery audit trail
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_timezone = 'UTC'
timezone = 'UTC'
