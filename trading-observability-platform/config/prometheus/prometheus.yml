global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    environment: local-paper-sandbox
    platform: trading-observability-platform

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: trading-observability-app
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9108"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "(order_id|client_order_id|trace_id|account_id)"
        action: drop

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
